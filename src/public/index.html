<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#141817" />
    <title>BST BT Radio</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow" id="siteLabel">BST BT Radio</p>
          <h1 id="nowPlaying">Idle</h1>
        </div>
        <button class="icon-button" id="stopButton" type="button" title="Stop" aria-label="Stop">
          <span aria-hidden="true">■</span>
        </button>
      </header>

      <section class="control-band">
        <div class="field">
          <label for="volumeSlider">Volume</label>
          <div class="volume-row">
            <input id="volumeSlider" type="range" min="0" max="100" value="50" />
            <output id="volumeValue" for="volumeSlider">50</output>
          </div>
        </div>
        <div class="field">
          <span>Startup</span>
          <div class="segmented" role="group" aria-label="Startup mode">
            <button type="button" id="startupIdle">Idle</button>
            <button type="button" id="startupResume">Resume</button>
          </div>
        </div>
      </section>

      <section class="section">
        <div class="section-heading">
          <h2>Speakers</h2>
          <span id="speakerStatus">Disconnected</span>
        </div>
        <div class="speaker-grid" id="speakers"></div>
      </section>

      <section class="section station-section">
        <div class="section-heading">
          <h2>Stations</h2>
          <span id="playbackStatus">Idle</span>
        </div>
        <div class="station-groups" id="stations"></div>
      </section>

      <section class="section" id="locationsSection" hidden>
        <div class="section-heading">
          <h2>Locations</h2>
          <span>Local</span>
        </div>
        <div class="locations" id="locations"></div>
      </section>
    </main>
    <script src="/app.js" type="module"></script>
  </body>
</html>
